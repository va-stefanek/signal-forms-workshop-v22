<label class="option"><input type="checkbox" [formField]="wantsInvoice()" /> I need an invoice</label>
@if (wantsInvoice()().value()) {
  @let c = invoice();
  <div class="grid spaced">
    <div class="field">
      <label for="companyName">Company name</label>
      <input id="companyName" [formField]="c.name" />
      <app-field-errors [field]="c.name" />
    </div>
    <div class="field">
      <label for="nip">NIP</label>
      <!-- TODO 5.1: replace this input with the legacy <lib-nip-input inputId="nip"> (a ControlValueAccessor
           from the company library, see legacy/nip-input/) bound with [formField]. Check that its
           NG_VALIDATORS checksum error shows up on the field. -->
      <input id="nip" [formField]="c.nip" />
      <!-- TODO 5.4: show the NIP hint from HINT metadata in a <span class="hint"> here -->
      <app-field-errors [field]="c.nip" />
    </div>
    <div class="field">
      <label for="street">Street</label>
      <input id="street" [formField]="c.street" />
      <app-field-errors [field]="c.street" />
    </div>
    <div class="field">
      <label for="city">City</label>
      <input id="city" [formField]="c.city" />
      <app-field-errors [field]="c.city" />
    </div>
    <div class="field">
      <label for="postalCode">Postal code</label>
      <input id="postalCode" [formField]="c.postalCode" />
      <app-field-errors [field]="c.postalCode" />
    </div>
  </div>
}
